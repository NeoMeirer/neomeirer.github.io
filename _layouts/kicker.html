---
layout: default
---
<div class="kicker-app">
  <h1>⚽ Kicker Ticker</h1>

  <nav class="main-tabs">
    <button onclick="switchTab('stats', this)" class="active">Rangliste</button>
    <button onclick="switchTab('history', this)">Spiele</button>
    <button onclick="switchTab('play', this)" id="play-tab-btn" style="display:none;">Eintragen</button>
  </nav>

  <section id="login-section">
    <div class="login-card">
      <h3>🔐 Login</h3>
      <div class="input-group">
        <input type="password" id="login-pass" placeholder="Passwort" onkeydown="if(event.key==='Enter') login()">
        <button onclick="login()">Go</button>
      </div>
    </div>
  </section>

  <div id="tab-stats" class="tab-content active">
    <section>
      <div id="stats-table"><div class="loading">Lädt...</div></div>
    </section>
  </div>

  <div id="tab-history" class="tab-content">
    <section>
      <div id="game-history"></div>
    </section>
  </div>

  <div id="tab-play" class="tab-content">
    <section>
      <h3>Spiel eintragen</h3>
      <div class="game-form">
        <select id="t1p1"></select>
        <select id="t1p2"></select>
        <div class="vs">VS</div>
        <select id="t2p1"></select>
        <select id="t2p2"></select>
      </div>
      <div class="score-input">
        <input type="number" id="s1" placeholder="Team 1" min="0">
        <span>:</span>
        <input type="number" id="s2" placeholder="Team 2" min="0">
      </div>
      <button class="submit-btn" onclick="addGame()">Speichern</button>
      <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
      <h3>Neuer Spieler</h3>
      <div class="input-group">
        <input type="text" id="playerName" placeholder="Name">
        <button onclick="addPlayer()">+</button>
      </div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = supabase.createClient('https://qqoxwxomidrdkwhwndcg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxb3h3eG9taWRyZGt3aHduZGNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwOTQzODgsImV4cCI6MjA5MTY3MDM4OH0.XteSAXrWrSRMwiN-3tYB6PyMZ1hLFPFg4-2dLU3QtOo');
  let players = [], games = [];

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.main-tabs button').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    btn.classList.add('active');
  }

  async function login() {
    const pass = document.getElementById('login-pass').value;
    if (pass === 'kicker' || pass === 'admin123') {
      document.getElementById('play-tab-btn').style.display = 'inline-block';
      document.getElementById('login-section').style.display = 'none';
      switchTab('play', document.getElementById('play-tab-btn'));
      loadAll();
    } else alert('Falsches Passwort');
  }

  async function loadAll() {
    const { data: pData } = await sb.from('players').select('*').order('elo', { ascending: false });
    players = pData || [];
    const { data: gData } = await sb.from('games').select('*').order('played_at', { ascending: false });
    games = gData || [];
    
    updateDropdowns();
    renderStats();
    renderHistory();
  }

  function updateDropdowns() {
    const pOpts = '<option value="">- Spieler -</option>' + players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    ['t1p1', 't1p2', 't2p1', 't2p2'].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.innerHTML = pOpts; }
    });
  }

  async function addGame() {
    const g = {
      team1_player1: document.getElementById('t1p1').value,
      team1_player2: document.getElementById('t1p2').value || null,
      team2_player1: document.getElementById('t2p1').value,
      team2_player2: document.getElementById('t2p2').value || null,
      score_team1: parseInt(document.getElementById('s1').value),
      score_team2: parseInt(document.getElementById('s2').value)
    };
    if (!g.team1_player1 || !g.team2_player1 || isNaN(g.score_team1)) return alert('Bitte Teams und Score ausfüllen!');
    
    const { error } = await sb.from('games').insert([g]);
    if (error) return alert(error.message);
    
    await updateElos(g);
    document.getElementById('s1').value = '';
    document.getElementById('s2').value = '';
    loadAll();
    alert('Spiel gespeichert!');
  }

  async function updateElos(g) {
    const pIds = [g.team1_player1, g.team1_player2, g.team2_player1, g.team2_player2].filter(Boolean);
    const { data: curr } = await sb.from('players').select('id, elo').in('id', pIds);
    const getE = id => curr.find(p => p.id === id)?.elo || 1000;
    
    const t1 = [g.team1_player1, g.team1_player2].filter(Boolean);
    const t2 = [g.team2_player1, g.team2_player2].filter(Boolean);
    
    const elo1 = t1.reduce((s, id) => s + getE(id), 0) / t1.length;
    const elo2 = t2.reduce((s, id) => s + getE(id), 0) / t2.length;
    
    const prob1 = 1 / (1 + Math.pow(10, (elo2 - elo1) / 400));
    const result1 = g.score_team1 > g.score_team2 ? 1 : (g.score_team1 < g.score_team2 ? 0 : 0.5);
    const diff = Math.round(32 * (result1 - prob1));
    
    for (const id of t1) await sb.from('players').update({ elo: getE(id) + diff }).eq('id', id);
    for (const id of t2) await sb.from('players').update({ elo: getE(id) - diff }).eq('id', id);
  }

  function renderStats() {
    const el = document.getElementById('stats-table');
    let h = '<table><tr><th>#</th><th>Spieler</th><th>Elo</th><th>W/L</th></tr>';
    players.sort((a,b) => b.elo - a.elo).forEach((p, i) => {
      const pGames = games.filter(g => [g.team1_player1, g.team1_player2, g.team2_player1, g.team2_player2].includes(p.id));
      let w=0, l=0;
      pGames.forEach(g => {
        const isT1 = [g.team1_player1, g.team1_player2].includes(p.id);
        if (isT1 ? g.score_team1 > g.score_team2 : g.score_team2 > g.score_team1) w++; else l++;
      });
      h += `<tr><td>${i+1}</td><td><strong>${p.name}</strong></td><td>${Math.round(p.elo)}</td><td>${w}/${l}</td></tr>`;
    });
    el.innerHTML = h + '</table>';
  }

  function renderHistory() {
    const gn = id => players.find(p => p.id === id)?.name || '?';
    document.getElementById('game-history').innerHTML = games.map(g => `
      <div class="game-row">
        <span>${[gn(g.team1_player1), gn(g.team1_player2)].filter(n=>n!='?').join('+')}</span>
        <strong>${g.score_team1}:${g.score_team2}</strong>
        <span>${[gn(g.team2_player1), gn(g.team2_player2)].filter(n=>n!='?').join('+')}</span>
      </div>
    `).join('');
  }

  async function addPlayer() {
    const name = document.getElementById('playerName').value.trim();
    if (!name) return;
    await sb.from('players').insert([{ name, elo: 1000 }]);
    document.getElementById('playerName').value = '';
    loadAll();
  }

  loadAll();
</script>

<style>
  body { font-family: sans-serif; background: #f0f2f5; margin: 0; color: #333; }
  .kicker-app { max-width: 500px; margin: 0 auto; padding: 20px; }
  .main-tabs { display: flex; gap: 5px; margin-bottom: 20px; }
  .main-tabs button { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #ddd; cursor: pointer; font-weight: bold; }
  .main-tabs button.active { background: #007bff; color: white; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .input-group { display: flex; gap: 5px; }
  input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; flex: 1; margin: 5px 0; }
  .game-form { display: grid; gap: 5px; text-align: center; }
  .vs { font-weight: bold; color: #888; margin: 5px 0; }
  .score-input { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0; }
  .score-input input { width: 60px; text-align: center; font-size: 20px; font-weight: bold; }
  .submit-btn { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 5px; border-bottom: 1px solid #eee; }
  .game-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .login-card { text-align: center; }
</style>
