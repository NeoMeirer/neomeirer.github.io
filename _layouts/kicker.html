---
layout: default
---
{% assign v = site.time | date: '%s' %}
<link rel="stylesheet" href="{{ '/assets/kicker/kicker.css' | relative_url }}?v={{ v }}">

<div class="kt" id="kt">
  <header class="kt-header">
    <div>
      <h1 class="kt-title">Kicker-Ticker</h1>
      <p class="kt-season" id="kt-season">Lädt …</p>
    </div>
    <div class="kt-auth" id="kt-auth"></div>
  </header>

  <nav class="kt-tabs" id="kt-tabs" aria-label="Bereiche">
    <button data-tab="rank">Rangliste</button>
    <button data-tab="player">Spieler</button>
    <button data-tab="duos">Duos</button>
    <button data-tab="lineup">Aufstellung</button>
    <button data-tab="games">Spiele</button>
    <button data-tab="archive">Archiv</button>
    <button data-tab="entry" data-needs="login" hidden>Eintragen</button>
    <button data-tab="admin" data-needs="admin" hidden>Admin</button>
  </nav>

  <!-- Filter gelten für alles darunter -->
  <div class="kt-filters" id="kt-filters">
    <div class="kt-seg" role="group" aria-label="Spielmodus" data-filter="mode">
      <button data-value="duo">2 gegen 2</button>
      <button data-value="solo">1 gegen 1</button>
    </div>
    <div class="kt-seg" role="group" aria-label="Zeitraum" data-filter="scope">
      <button data-value="season">Aktuelle Saison</button>
      <button data-value="all">Ewige Tabelle</button>
    </div>
  </div>

  <div class="kt-body">
    <section class="kt-panel" data-panel="rank"></section>
    <section class="kt-panel" data-panel="player"></section>
    <section class="kt-panel" data-panel="duos"></section>
    <section class="kt-panel" data-panel="lineup"></section>
    <section class="kt-panel" data-panel="games"></section>
    <section class="kt-panel" data-panel="archive"></section>
    <section class="kt-panel" data-panel="entry"></section>
    <section class="kt-panel" data-panel="admin"></section>
    <section class="kt-panel" data-panel="login"></section>
  </div>

  <div class="kt-toast" id="kt-toast" role="status" aria-live="polite" hidden></div>
  <div class="kt-tooltip" id="kt-tooltip" hidden></div>
</div>
