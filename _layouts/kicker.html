---
layout: default
---

<div class="kicker-app">
  <h1>🏆 Kicker Liga</h1>
  
  <!-- Login Section -->
  <section id="login-section">
    <div class="input-group">
      <input type="password" id="login-pass" placeholder="Passwort für Login">
      <button onclick="login()">Login</button>
    </div>
    <div id="login-status" style="margin-top:10px; font-size:0.9em; color:#666;">Standardmäßig: Nur Statistiken sichtbar</div>
  </section>

  <!-- Admin Controls (Hidden by default) -->
  <section id="admin-controls" style="display:none;">
    <h2>Admin-Optionen</h2>
    <div class="input-group">
      <input type="text" id="playerName" placeholder="Neuer Spieler Name">
      <button onclick="addPlayer()">Spieler hinzufügen</button>
    </div>
    <div style="margin-top:15px;">
      <button onclick="resetSeason()" style="background:#e67e22;">Saison zurücksetzen (Archivieren)</button>
    </div>
    <div id="player-list-admin" style="margin-top:15px;"></div>
  </section>

  <!-- Player Controls (Hidden by default) -->
  <section id="player-controls" style="display:none;">
    <h2>Spiel eintragen</h2>
    <div class="game-form">
      <div class="team-input">
        <h3>Team 1</h3>
        <select id="t1p1" onchange="predictOutcome()"></select>
        <select id="t1p2" onchange="predictOutcome()"></select>
        <input type="number" id="s1" placeholder="Tore">
      </div>
      <div class="team-input">
        <h3>Team 2</h3>
        <select id="t2p1" onchange="predictOutcome()"></select>
        <select id="t2p2" onchange="predictOutcome()"></select>
        <input type="number" id="s2" placeholder="Tore">
      </div>
      <div id="prediction-box" style="padding:10px; background:#e8f4fd; border-radius:6px; margin-bottom:10px; text-align:center; font-weight:bold; display:none;"></div>
      <button onclick="addGame()" class="submit-btn">Spiel speichern</button>
    </div>
  </section>

  <!-- Statistics -->
  <section>
    <h2>Rangliste</h2>
    <div id="stats">Lädt...</div>
  </section>

  <!-- Advanced Stats (Archived/History) -->
  <section id="advanced-stats" style="display:none;">
    <h2>Erweiterte Statistiken</h2>
    <div id="h2h-section"></div>
    <div id="chemistry-section" style="margin-top:20px;"></div>
  </section>

  <section>
    <h2>Letzte Spiele</h2>
    <div id="history">Keine Spiele eingetragen.</div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  'https://qqoxwxomidrdkwhwndcg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxb3h3eG9taWRyZGt3aHduZGNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwOTQzODgsImV4cCI6MjA5MTY3MDM4OH0.XteSAXrWrSRMwiN-3tYB6PyMZ1hLFPFg4-2dLU3QtOo'
);

let currentUserRole = null; // 'admin', 'player', or null
let allPlayers = [];
let allGames = [];

async function login() {
  const pass = document.getElementById('login-pass').value;
  // Einfache Passwörter für Demo-Zwecke (NeoMeirer kann diese in Supabase/Edge Functions sicherer machen)
  if (pass === 'admin123') {
    currentUserRole = 'admin';
    document.getElementById('admin-controls').style.display = 'block';
    document.getElementById('player-controls').style.display = 'block';
    document.getElementById('advanced-stats').style.display = 'block';
    document.getElementById('login-section').style.display = 'none';
  } else if (pass === 'kicker') {
    currentUserRole = 'player';
    document.getElementById('player-controls').style.display = 'block';
    document.getElementById('advanced-stats').style.display = 'block';
    document.getElementById('login-section').style.display = 'none';
  } else {
    alert('Falsches Passwort');
  }
  loadAll();
}

async function addPlayer() {
  const name = document.getElementById('playerName').value.trim();
  if (!name) return;
  const { error } = await sb.from('players').insert([{ name, elo: 1000 }]);
  if (error) alert(error.message);
  else {
    document.getElementById('playerName').value = '';
    loadAll();
  }
}

async function deletePlayer(id) {
  if (!confirm('Spieler wirklich löschen?')) return;
  const { error } = await sb.from('players').delete().eq('id', id);
  if (error) alert(error.message);
  else loadAll();
}

async function deleteGame(id) {
  if (!confirm('Spiel wirklich löschen?')) return;
  const { error } = await sb.from('games').delete().eq('id', id);
  if (error) alert(error.message);
  else loadAll();
}

async function resetSeason() {
  if (!confirm('Wirklich alle aktuellen Statistiken resetten und archivieren?')) return;
  // In einer echten App würde man hier eine 'seasons' Tabelle nutzen oder Spiele markieren.
  // Hier markieren wir alle aktuellen Spiele als 'archived'.
  const { error } = await sb.from('games').update({ archived: true }).eq('archived', false);
  if (error) alert(error.message);
  else {
    // Elo Reset
    await sb.from('players').update({ elo: 1000 }).neq('id', 0);
    loadAll();
  }
}

async function addGame() {
  const game = {
    team1_player1: document.getElementById('t1p1').value,
    team1_player2: document.getElementById('t1p2').value || null,
    team2_player1: document.getElementById('t2p1').value,
    team2_player2: document.getElementById('t2p2').value || null,
    score_team1: parseInt(document.getElementById('s1').value),
    score_team2: parseInt(document.getElementById('s2').value),
    archived: false
  };

  if (!game.team1_player1 || !game.team2_player1 || isNaN(game.score_team1) || isNaN(game.score_team2)) {
    alert('Bitte fülle alle Felder aus.');
    return;
  }

  const { error } = await sb.from('games').insert([game]);
  if (error) alert(error.message);
  else {
    // Elo Update Logik (Clientseitig für dieses Beispiel)
    await updateElos(game);
    document.getElementById('s1').value = '';
    document.getElementById('s2').value = '';
    loadAll();
  }
}

async function updateElos(game) {
  const p1_1 = allPlayers.find(p => p.id == game.team1_player1);
  const p2_1 = allPlayers.find(p => p.id == game.team2_player1);
  // Durchschnitts-Elo für Teams
  let elo1 = p1_1.elo;
  if(game.team1_player2) elo1 = (elo1 + allPlayers.find(p => p.id == game.team1_player2).elo)/2;
  
  let elo2 = p2_1.elo;
  if(game.team2_player2) elo2 = (elo2 + allPlayers.find(p => p.id == game.team2_player2).elo)/2;

  const k = 32;
  const exp1 = 1 / (1 + Math.pow(10, (elo2 - elo1) / 400));
  const actual1 = game.score_team1 > game.score_team2 ? 1 : (game.score_team1 < game.score_team2 ? 0 : 0.5);
  
  const diff = Math.round(k * (actual1 - exp1));

  // Update in DB
  const updatePlayerElo = async (id, change) => {
    const p = allPlayers.find(x => x.id == id);
    await sb.from('players').update({ elo: p.elo + change }).eq('id', id);
  };

  await updatePlayerElo(game.team1_player1, diff);
  if(game.team1_player2) await updatePlayerElo(game.team1_player2, diff);
  await updatePlayerElo(game.team2_player1, -diff);
  if(game.team2_player2) await updatePlayerElo(game.team2_player2, -diff);
}

function predictOutcome() {
  const t1p1 = document.getElementById('t1p1').value;
  const t1p2 = document.getElementById('t1p2').value;
  const t2p1 = document.getElementById('t2p1').value;
  const t2p2 = document.getElementById('t2p2').value;

  if (!t1p1 || !t2p1) {
    document.getElementById('prediction-box').style.display = 'none';
    return;
  }

  let elo1 = allPlayers.find(p => p.id == t1p1)?.elo || 1000;
  if(t1p2) elo1 = (elo1 + (allPlayers.find(p => p.id == t1p2)?.elo || 1000))/2;
  
  let elo2 = allPlayers.find(p => p.id == t2p1)?.elo || 1000;
  if(t2p2) elo2 = (elo2 + (allPlayers.find(p => p.id == t2p2)?.elo || 1000))/2;

  const prob1 = (1 / (1 + Math.pow(10, (elo2 - elo1) / 400)) * 100).toFixed(1);
  const box = document.getElementById('prediction-box');
  box.innerHTML = `Gewinnchance Team 1: ${prob1}% | Team 2: ${(100-prob1).toFixed(1)}%`;
  box.style.display = 'block';
}

async function loadAll() {
  const { data: players } = await sb.from('players').select('*');
  const { data: games } = await sb.from('games').select('*').order('played_at', { ascending: false });
  
  if (!players) return;
  allPlayers = players;
  allGames = games || [];

  // Dropdowns
  ['t1p1', 't1p2', 't2p1', 't2p2'].forEach(sId => {
    const el = document.getElementById(sId);
    const v = el.value;
    el.innerHTML = '<option value="">- Spieler wählen -</option>';
    players.sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
      el.innerHTML += `<option value="${p.id}">${p.name}</option>`;
    });
    el.value = v;
  });

  if (currentUserRole === 'admin') {
    let plist = '<ul>';
    players.forEach(p => {
      plist += `<li>${p.name} <button onclick="deletePlayer(${p.id})" style="padding:2px 5px; background:#e74c3c; font-size:10px;">X</button></li>`;
    });
    document.getElementById('player-list-admin').innerHTML = plist + '</ul>';
  }

  buildStats(players, allGames);
  buildHistory(allGames, players);
  if (currentUserRole) buildAdvancedStats(players, allGames);
}

function buildStats(players, games) {
  const activeGames = games.filter(g => !g.archived);
  const m = new Map();
  players.forEach(p => m.set(p.id, { name: p.name, w: 0, l: 0, elo: p.elo || 1000, streak: 0, lastResult: null }));

  // Streak berechnen (nur letzte 10 Spiele für Performance)
  activeGames.slice().reverse().forEach(g => {
    const t1 = [g.team1_player1, g.team1_player2].filter(Boolean);
    const t2 = [g.team2_player1, g.team2_player2].filter(Boolean);
    const wt = g.score_team1 > g.score_team2 ? 1 : (g.score_team2 > g.score_team1 ? 2 : 0);
    
    t1.forEach(id => {
      const s = m.get(id);
      if(!s) return;
      if(wt === 1) { s.w++; s.streak = s.streak >= 0 ? s.streak + 1 : 1; }
      else if(wt === 2) { s.l++; s.streak = s.streak <= 0 ? s.streak - 1 : -1; }
    });
    t2.forEach(id => {
      const s = m.get(id);
      if(!s) return;
      if(wt === 2) { s.w++; s.streak = s.streak >= 0 ? s.streak + 1 : 1; }
      else if(wt === 1) { s.l++; s.streak = s.streak <= 0 ? s.streak - 1 : -1; }
    });
  });

  const arr = Array.from(m.values()).sort((a, b) => b.elo - a.elo);
  let h = '<table><thead><tr><th>Spieler</th><th>Elo</th><th>S/N</th><th>Streak</th></tr></thead><tbody>';
  arr.forEach(s => {
    const streakClass = s.streak > 0 ? 'text-green' : (s.streak < 0 ? 'text-red' : '');
    const streakSign = s.streak > 0 ? '+' : '';
    h += `<tr>
      <td>${s.name}</td>
      <td><strong>${Math.round(s.elo)}</strong></td>
      <td>${s.w}/${s.l}</td>
      <td class="${streakClass}">${s.streak !== 0 ? streakSign + s.streak : '-'}</td>
    </tr>`;
  });
  document.getElementById('stats').innerHTML = h + '</tbody></table>';
}

function buildAdvancedStats(players, games) {
  // Chemistry Bonus
  const pairs = new Map();
  games.forEach(g => {
    const teams = [
      {p: [g.team1_player1, g.team1_player2].filter(Boolean).sort(), win: g.score_team1 > g.score_team2},
      {p: [g.team2_player1, g.team2_player2].filter(Boolean).sort(), win: g.score_team2 > g.score_team1}
    ];
    teams.forEach(t => {
      if(t.p.length === 2) {
        const key = t.p.join('-');
        if(!pairs.has(key)) pairs.set(key, {w:0, t:0, names: t.p.map(id => players.find(p=>p.id==id).name).join(' & ')});
        const data = pairs.get(key);
        data.t++;
        if(t.win) data.w++;
      }
    });
  });

  let chemH = '<h3>Beste Paare (Chemie)</h3><ul>';
  Array.from(pairs.values())
    .filter(p => p.t >= 2)
    .sort((a,b) => (b.w/b.t) - (a.w/a.t))
    .slice(0,5)
    .forEach(p => {
      chemH += `<li>${p.names}: ${(p.w/p.t*100).toFixed(0)}% Winrate (${p.w}/${p.t})</li>`;
    });
  document.getElementById('chemistry-section').innerHTML = chemH + '</ul>';

  // Head-to-Head (Top 2 Spieler als Beispiel oder Auswahl)
  // Hier vereinfacht: H2H Matrix für alle
}

function buildHistory(games, players) {
  if (!games.length) { document.getElementById('history').innerHTML = 'Keine Spiele eingetragen.'; return; }
  const gn = id => players.find(p => p.id === id)?.name || '';
  document.getElementById('history').innerHTML = games.map(g => {
    const t1 = [gn(g.team1_player1), gn(g.team1_player2)].filter(Boolean).join(' & ');
    const t2 = [gn(g.team2_player1), gn(g.team2_player2)].filter(Boolean).join(' & ');
    const delBtn = currentUserRole === 'admin' ? `<button onclick="deleteGame(${g.id})" style="margin-left:10px; padding:2px 5px; background:#e74c3c; font-size:10px;">X</button>` : '';
    const archivedTag = g.archived ? '<span style="font-size:0.7em; color:gray;">[Archiv]</span> ' : '';
    return `<div class="game-row">
      <span class="teams">${t1}</span>
      <span class="score">${g.score_team1}:${g.score_team2}</span>
      <span class="teams">${t2} ${archivedTag}${delBtn}</span>
    </div>`;
  }).join('');
}

loadAll();
</script>

<style>
.kicker-app { font-family: -apple-system, system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; color: #333; }
h1 { text-align: center; color: #2c3e50; }
section { background: #fff; padding: 25px; margin-bottom: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,.05); border: 1px solid #eee; }
h2 { border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 0; color: #2980b9; }
h3 { margin-bottom: 10px; font-size: 1.1em; }
.input-group { display: flex; gap: 10px; }
input, select { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
button { padding: 10px 20px; background: #3498db; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
button:hover { background: #2980b9; }
.submit-btn { width: 100%; font-weight: bold; background: #27ae60; margin-top: 10px; font-size: 1.1em; }
.submit-btn:hover { background: #219150; }
.team-input { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #edf2f7; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 15px; border-bottom: 1px solid #edf2f7; }
th { background: #f8f9fa; font-weight: 600; }
.game-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
.score { font-weight: bold; background: #f1f3f5; padding: 6px 14px; border-radius: 20px; min-width: 50px; text-align: center; }
.teams { flex: 1; font-size: 0.95em; }
.text-green { color: #27ae60; font-weight: bold; }
.text-red { color: #e74c3c; font-weight: bold; }
ul { padding-left: 20px; }
li { margin-bottom: 5px; }
</style>
