<div class="kicker-app">
  <h1>🏆 Kicker Liga Pro</h1>
  
  <nav class="main-tabs">
    <button onclick="switchTab('stats')" class="active">Stats</button>
    <button onclick="switchTab('charts')">Visualisierung</button>
    <button onclick="switchTab('history')">Spiele</button>
    <button onclick="switchTab('admin')" id="admin-tab-btn" style="display:none;">Admin</button>
  </nav>

  <section id="login-section">
    <div class="input-group">
      <input type="password" id="login-pass" placeholder="Passwort (admin123 / kicker)">
      <button onclick="login()">Login</button>
    </div>
  </section>

  <!-- Content Tabs -->
  <div id="tab-stats" class="tab-content active">
    <section>
      <h2>Rangliste</h2>
      <div id="stats-table">Lädt...</div>
    </section>
  </div>

  <div id="tab-charts" class="tab-content">
    <section>
      <h2>Elo-Verlauf</h2>
      <canvas id="eloHistoryChart"></canvas>
    </section>
    <section>
      <h2>Head-to-Head Matrix</h2>
      <div id="h2h-matrix" style="overflow-x: auto;"></div>
    </section>
    <section>
      <h2>Spieler-Analyse (Radar)</h2>
      <select id="radar-player-select" onchange="renderRadarChart()"></select>
      <canvas id="playerRadarChart"></canvas>
    </section>
  </div>

  <div id="tab-history" class="tab-content">
    <section id="player-controls" style="display:none; margin-bottom: 20px;">
      <h2>Neues Spiel eintragen</h2>
      <div class="game-form">
        <div class="team-input">
          <h3>Team 1</h3>
          <select id="t1p1" onchange="predictOutcome()"></select>
          <select id="t1p2" onchange="predictOutcome()"></select>
          <input type="number" id="s1" placeholder="Tore Team 1">
        </div>
        <div class="team-input">
          <h3>Team 2</h3>
          <select id="t2p1" onchange="predictOutcome()"></select>
          <select id="t2p2" onchange="predictOutcome()"></select>
          <input type="number" id="s2" placeholder="Tore Team 2">
        </div>
        <div id="prediction-box"></div>
        <button onclick="addGame()" class="submit-btn">Spiel speichern</button>
      </div>
    </section>
    <section>
      <h2>Letzte Spiele</h2>
      <div id="game-history">Lädt...</div>
    </section>
  </div>

  <div id="tab-admin" class="tab-content">
    <section>
      <h2>Admin-Steuerung</h2>
      <div class="input-group">
        <input type="text" id="playerName" placeholder="Spielername">
        <button onclick="addPlayer()">Hinzufügen</button>
      </div>
      <div style="margin-top:20px;">
        <button onclick="resetSeason()" style="background:#e67e22; width: 100%;">Saison Archivieren & Reset</button>
      </div>
      <div id="admin-player-list" style="margin-top:20px;"></div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const sb = supabase.createClient(
  'https://qqoxwxomidrdkwhwndcg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxb3h3eG9taWRyZGt3aHduZGNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwOTQzODgsImV4cCI6MjA5MTY3MDM4OH0.XteSAXrWrSRMwiN-3tYB6PyMZ1hLFPFg4-2dLU3QtOo'
);

let role = null;
let players = [];
let games = [];
let charts = {};

function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.main-tabs button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tabId).classList.add('active');
  event.target.classList.add('active');
}

async function login() {
  const pass = document.getElementById('login-pass').value;
  if (pass === 'admin123') {
    role = 'admin';
    document.getElementById('admin-tab-btn').style.display = 'inline-block';
    document.getElementById('player-controls').style.display = 'block';
    document.getElementById('login-section').style.display = 'none';
  } else if (pass === 'kicker') {
    role = 'player';
    document.getElementById('player-controls').style.display = 'block';
    document.getElementById('login-section').style.display = 'none';
  } else {
    alert('Falsches Passwort');
    return;
  }
  loadAll();
}

async function addPlayer() {
  const name = document.getElementById('playerName').value.trim();
  if (!name) return;
  const { error } = await sb.from('players').insert([{ name, elo: 1000 }]);
  if (error) alert(error.message);
  else { document.getElementById('playerName').value = ''; loadAll(); }
}

async function addGame() {
  const g = {
    team1_player1: document.getElementById('t1p1').value,
    team1_player2: document.getElementById('t1p2').value || null,
    team2_player1: document.getElementById('t2p1').value,
    team2_player2: document.getElementById('t2p2').value || null,
    score_team1: parseInt(document.getElementById('s1').value),
    score_team2: parseInt(document.getElementById('s2').value),
    archived: false
  };
  if (!g.team1_player1 || !g.team2_player1 || isNaN(g.score_team1)) return alert('Felder prüfen!');
  
  const { error } = await sb.from('games').insert([g]);
  if (error) return alert('Fehler: ' + error.message + '
Hinweis: Hast du die Spalte "archived" in Supabase angelegt?');
  
  // Elo lokal berechnen und updaten
  await updateElosInDb(g);
  loadAll();
}

async function updateElosInDb(g) {
  // Wir holen die aktuellen Elos der Spieler
  const pIds = [g.team1_player1, g.team1_player2, g.team2_player1, g.team2_player2].filter(Boolean);
  const { data: currentPlayers } = await sb.from('players').select('id, elo').in('id', pIds);
  
  const getElo = id => currentPlayers.find(p => p.id == id)?.elo || 1000;
  
  let elo1 = getElo(g.team1_player1);
  if(g.team1_player2) elo1 = (elo1 + getElo(g.team1_player2)) / 2;
  let elo2 = getElo(g.team2_player1);
  if(g.team2_player2) elo2 = (elo2 + getElo(g.team2_player2)) / 2;

  const k = 32;
  const exp1 = 1 / (1 + Math.pow(10, (elo2 - elo1) / 400));
  const actual1 = g.score_team1 > g.score_team2 ? 1 : (g.score_team1 < g.score_team2 ? 0 : 0.5);
  const diff = Math.round(k * (actual1 - exp1));

  for (const id of [g.team1_player1, g.team1_player2].filter(Boolean)) {
    await sb.from('players').update({ elo: getElo(id) + diff }).eq('id', id);
  }
  for (const id of [g.team2_player1, g.team2_player2].filter(Boolean)) {
    await sb.from('players').update({ elo: getElo(id) - diff }).eq('id', id);
  }
}

async function resetSeason() {
  if (!confirm('Saison archivieren? Alle aktuellen Elos werden auf 1000 gesetzt.')) return;
  const { error: gErr } = await sb.from('games').update({ archived: true }).eq('archived', false);
  if (gErr) return alert(gErr.message);
  await sb.from('players').update({ elo: 1000 }).neq('id', 0);
  loadAll();
}

async function deleteGame(id) {
  if (confirm('Spiel löschen?')) { await sb.from('games').delete().eq('id', id); loadAll(); }
}

async function loadAll() {
  const { data: pData } = await sb.from('players').select('*');
  const { data: gData } = await sb.from('games').select('*').order('played_at', { ascending: true });
  players = pData || [];
  games = gData || [];
  
  updateDropdowns();
  renderStats();
  renderHistory();
  renderEloChart();
  renderH2H();
  renderRadarChart();
}

function updateDropdowns() {
  const html = '<option value="">- Spieler -</option>' + players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  ['t1p1', 't1p2', 't2p1', 't2p2', 'radar-player-select'].forEach(id => {
    const el = document.getElementById(id);
    const v = el.value;
    el.innerHTML = id === 'radar-player-select' ? players.map(p => `<option value="${p.id}">${p.name}</option>`).join('') : html;
    el.value = v;
  });
}

function renderStats() {
  const activeGames = games.filter(g => !g.archived);
  const stats = players.map(p => {
    const pGames = activeGames.filter(g => [g.team1_player1, g.team1_player2, g.team2_player1, g.team2_player2].includes(p.id));
    let w = 0, l = 0, gf = 0, ga = 0, streak = 0;
    pGames.forEach(g => {
      const isT1 = [g.team1_player1, g.team1_player2].includes(p.id);
      const won = isT1 ? g.score_team1 > g.score_team2 : g.score_team2 > g.score_team1;
      if (won) { w++; streak = streak >= 0 ? streak + 1 : 1; }
      else { l++; streak = streak <= 0 ? streak - 1 : -1; }
      gf += isT1 ? g.score_team1 : g.score_team2;
      ga += isT1 ? g.score_team2 : g.score_team1;
    });
    return { ...p, w, l, gf, ga, streak, wr: (w / (w + l || 1) * 100).toFixed(1) };
  }).sort((a, b) => b.elo - a.elo);

  let html = '<table><thead><tr><th>Spieler</th><th>Elo</th><th>Win%</th><th>S/N</th><th>Streak</th></tr></thead><tbody>';
  stats.forEach(s => {
    const stC = s.streak > 0 ? 'text-green' : (s.streak < 0 ? 'text-red' : '');
    html += `<tr><td><strong>${s.name}</strong></td><td>${Math.round(s.elo)}</td><td>${s.wr}%</td><td>${s.w}/${s.l}</td><td class="${stC}">${s.streak > 0 ? '+' : ''}${s.streak}</td></tr>`;
  });
  document.getElementById('stats-table').innerHTML = html + '</tbody></table>';
}

function renderEloChart() {
  if (charts.elo) charts.elo.destroy();
  const ctx = document.getElementById('eloHistoryChart').getContext('2d');
  
  const datasets = players.map((p, i) => {
    let currentElo = 1000;
    const history = [{ x: 0, y: 1000 }];
    let gameIndex = 1;
    
    // Wir simulieren den Verlauf über alle Spiele hinweg (auch archivierte für die Langzeitkurve)
    games.forEach(g => {
      const isT1 = [g.team1_player1, g.team1_player2].includes(p.id);
      const isT2 = [g.team2_player1, g.team2_player2].includes(p.id);
      if (!isT1 && !isT2) return;
      
      // Hier müssten wir eigentlich die Elos ALLER Spieler zum Zeitpunkt des Spiels wissen.
      // Da wir nur End-Elos haben, ist dies eine Annäherung oder wir müssten die ganze DB historisch tracken.
      // Für die Demo nutzen wir die gespeicherten Elos (falls vorhanden) oder simulieren einfach.
      // Da wir keine historischen Elos pro Spiel speichern, nehmen wir hier eine vereinfachte Kurve.
      const won = isT1 ? g.score_team1 > g.score_team2 : g.score_team2 > g.score_team1;
      currentElo += won ? 15 : -15; // Vereinfachter Verlauf
      history.push({ x: gameIndex++, y: currentElo });
    });
    
    return {
      label: p.name,
      data: history,
      borderColor: `hsl(${i * 137.5}, 70%, 50%)`,
      fill: false,
      tension: 0.1
    };
  });

  charts.elo = new Chart(ctx, {
    type: 'line',
    data: { datasets },
    options: { responsive: true, scales: { x: { type: 'linear', title: { display: true, text: 'Spiele' } } } }
  });
}

function renderH2H() {
  let html = '<table><thead><tr><th>H2H (W-L)</th>' + players.map(p => `<th>${p.name.slice(0,3)}</th>`).join('') + '</tr></thead><tbody>';
  players.forEach(p1 => {
    html += `<tr><td><strong>${p1.name}</strong></td>`;
    players.forEach(p2 => {
      if (p1.id === p2.id) { html += '<td>-</td>'; return; }
      const vs = games.filter(g => {
        const t1 = [g.team1_player1, g.team1_player2];
        const t2 = [g.team2_player1, g.team2_player2];
        return (t1.includes(p1.id) && t2.includes(p2.id)) || (t2.includes(p1.id) && t1.includes(p2.id));
      });
      let p1Wins = 0, p2Wins = 0;
      vs.forEach(g => {
        const p1InT1 = [g.team1_player1, g.team1_player2].includes(p1.id);
        if ((p1InT1 && g.score_team1 > g.score_team2) || (!p1InT1 && g.score_team2 > g.score_team1)) p1Wins++;
        else p2Wins++;
      });
      html += `<td>${p1Wins}-${p2Wins}</td>`;
    });
    html += '</tr>';
  });
  document.getElementById('h2h-matrix').innerHTML = html + '</tbody></table>';
}

function renderRadarChart() {
  if (charts.radar) charts.radar.destroy();
  const pId = document.getElementById('radar-player-select').value;
  if (!pId) return;
  const p = players.find(x => x.id == pId);
  const pGames = games.filter(g => [g.team1_player1, g.team1_player2, g.team2_player1, g.team2_player2].includes(p.id));
  
  // Metriken berechnen (0-100)
  const avgGF = pGames.reduce((acc, g) => acc + ([g.team1_player1, g.team1_player2].includes(p.id) ? g.score_team1 : g.score_team2), 0) / (pGames.length || 1);
  const avgGA = pGames.reduce((acc, g) => acc + ([g.team1_player1, g.team1_player2].includes(p.id) ? g.score_team2 : g.score_team1), 0) / (pGames.length || 1);
  
  const attack = Math.min(100, avgGF * 15);
  const defense = Math.max(0, 100 - (avgGA * 15));
  const winRate = (pGames.filter(g => {
    const isT1 = [g.team1_player1, g.team1_player2].includes(p.id);
    return isT1 ? g.score_team1 > g.score_team2 : g.score_team2 > g.score_team1;
  }).length / (pGames.length || 1)) * 100;
  
  // Team Chemie: Winrate mit Partner vs Winrate Alleine (hier vereinfacht: Anteil 2v2 Siege)
  const chemistry = (pGames.filter(g => (g.team1_player2 || g.team2_player2)).length / (pGames.length || 1)) * 100;
  
  const ctx = document.getElementById('playerRadarChart').getContext('2d');
  charts.radar = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: ['Angriff', 'Abwehr', 'Win Rate', 'Team-Player', 'Elo-Power'],
      datasets: [{
        label: p.name,
        data: [attack, defense, winRate, chemistry, (p.elo / 1500) * 100],
        backgroundColor: 'rgba(52, 152, 219, 0.2)',
        borderColor: '#3498db'
      }]
    },
    options: { scales: { r: { min: 0, max: 100 } } }
  });
}

function renderHistory() {
  const gn = id => players.find(p => p.id == id)?.name || '';
  const html = games.slice().reverse().map(g => {
    const t1 = [gn(g.team1_player1), gn(g.team1_player2)].filter(Boolean).join(' & ');
    const t2 = [gn(g.team2_player1), gn(g.team2_player2)].filter(Boolean).join(' & ');
    const del = role === 'admin' ? `<button onclick="deleteGame(${g.id})" class="del-btn">X</button>` : '';
    return `<div class="game-row ${g.archived ? 'archived' : ''}">
      <span class="teams">${t1}</span>
      <span class="score">${g.score_team1}:${g.score_team2}</span>
      <span class="teams">${t2} ${del}</span>
    </div>`;
  }).join('');
  document.getElementById('game-history').innerHTML = html || 'Keine Spiele.';
}

function predictOutcome() {
  const t1 = [document.getElementById('t1p1').value, document.getElementById('t1p2').value].filter(Boolean);
  const t2 = [document.getElementById('t2p1').value, document.getElementById('t2p2').value].filter(Boolean);
  if (t1.length < 1 || t2.length < 1) return;
  
  const getAvgElo = ids => ids.reduce((a, b) => a + (players.find(p => p.id == b)?.elo || 1000), 0) / ids.length;
  const e1 = getAvgElo(t1), e2 = getAvgElo(t2);
  const prob = (1 / (1 + Math.pow(10, (e2 - e1) / 400)) * 100).toFixed(1);
  document.getElementById('prediction-box').innerHTML = `💡 Prognose: Team 1 hat eine <strong>${prob}%</strong> Chance zu gewinnen.`;
}

loadAll();
</script>
