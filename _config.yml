# Site settings
title:          neolabs
description:    "Apps, Spiele und Experimente von Neo Meirer"
url:            "https://neomeirer.github.io"
lang:           de

# Author
author:
  name:         Neo Meirer

# Build settings
markdown:       kramdown
include:
  - _pages

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       5
paginate_path: "/paginator/page:num/"

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec ]

collections:
  hidden_posts:
    output: true

# Comments / Chat (via giscus + GitHub Discussions)
giscus:
  repo: "neomeirer/neomeirer.github.io"
  repo_id: "R_kgDOK-iy8Q"
  category: "General"
  category_id: "DIC_kwDOK-iy8c4C3dRd"
  theme: "https://neomeirer.github.io/assets/giscus-custom.css"
  lang: "de"

chat_topics:
  - "Allgemein"
  - "Fragen"
  - "Offtopic"
