# Site settings
title:          neolabs
description:    "Personal website"
#baseurl:        "/tale"
url:            "https://neomeirer.github.io"

# Google Analytics
google_analytics: UA—XXXXXXXX-X

# Author
author:
  name:         Neo Meirer
  email:        blabla@gmail.com

# Build settings
markdown:       kramdown
include:
  - _pages

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       5
paginate_path: "/paginator/page:num/"

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec ]

collections:
  hidden_posts:
    output: true

# Comments / Chat (via giscus + GitHub Discussions)
# Setup:
# 1) Enable Discussions in the GitHub repo
# 2) Install the "giscus" GitHub App for this repo
# 3) Use https://giscus.app to generate the IDs below
giscus:
  repo: "neomeirer/neomeirer.github.io"
  repo_id: "R_kgDOK-iy8Q"
  category: "General"
  category_id: "DIC_kwDOK-iy8c4C3dRd"
  theme: "https://neomeirer.github.io/assets/giscus-custom.css"
  lang: "de"

# Optional defaults for the chat include
chat_topics:
  - "Allgemein"
  - "Fragen"
  - "Offtopic"
